# Local dev services only. Production hosting is Consultation n°2 [C2] — data on
# Algerian territory, daily encrypted backups, monitoring [C2 §4].
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stade
      POSTGRES_PASSWORD: stade
      POSTGRES_DB: stade
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:
